services:
  os-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: os
      POSTGRES_USER: os
      POSTGRES_PASSWORD: ${OS_DB_PASSWORD}
    volumes:
    - os-data:/var/lib/postgresql/data
    networks:
    - os-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U os -d os
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
  billing-db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${BILLING_DB_PASSWORD}
    volumes:
    - billing-data:/var/lib/postgresql/data
    networks:
    - billing-data-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U billing -d billing
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
  mongo-key:
    image: mongo:7.0.45
    user: 0:0
    volumes:
    - ./generated/mongo-key:/input/key:ro
    - mongo-key:/key
    entrypoint:
    - bash
    - -c
    - cp /input/key /key/key && chown 999:999 /key/key && chmod 400 /key/key
    networks:
    - execution-data-net
  mongo:
    image: mongo:7.0.45
    command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    - --keyFile
    - /key/key
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    depends_on:
      mongo-key:
        condition: service_completed_successfully
    volumes:
    - mongo-data:/data/db
    - mongo-key:/key:ro
    networks:
    - execution-data-net
    mem_limit: 512m
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand({ping:1})
      interval: 3s
      timeout: 5s
      retries: 40
  mongo-init:
    image: mongo:7.0.45
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    volumes:
    - ./mongo-init.js:/init.js:ro
    entrypoint:
    - mongosh
    - --nodb
    - --quiet
    - /init.js
    networks:
    - execution-data-net
  rabbit:
    image: rabbitmq:4-management
    volumes:
    - rabbit-bootstrap-data:/var/lib/rabbitmq
    networks:
    - messages
    mem_limit: 384m
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2
      RABBITMQ_DEFAULT_USER: local-admin
      RABBITMQ_DEFAULT_PASS: ${RABBIT_ADMIN_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 30
    hostname: rabbit
  otel:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command:
    - --config=/etc/otel.yaml
    volumes:
    - ./otel.yaml:/etc/otel.yaml:ro
    networks:
    - messages
    mem_limit: 256m
  os:
    build: ../../workshop-os-service
    environment:
      RABBIT_HOST: rabbit
      RABBIT_USER: os-service
      RABBIT_PASSWORD: ${OS_RABBIT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${OS_SERVICE_TOKEN}
      IDENTITY_URL: http://os:8080
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OTEL_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      DB_URL: jdbc:postgresql://os-db:5432/os
      DB_USER: os
      DB_PASSWORD: ${OS_DB_PASSWORD}
      BILLING_SERVICE_TOKEN: ${BILLING_SERVICE_TOKEN}
      EXECUTION_SERVICE_TOKEN: ${EXECUTION_SERVICE_TOKEN}
      AUTH_SERVICE_TOKEN: ${AUTH_SERVICE_TOKEN:?Run configure.py first}
    depends_on:
      rabbit:
        condition: service_healthy
      os-db:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    networks:
    - messages
    - os-data-net
    mem_limit: 640m
    restart: unless-stopped
  billing:
    build: ../../workshop-billing-service
    environment:
      RABBIT_HOST: rabbit
      RABBIT_USER: billing-service
      RABBIT_PASSWORD: ${BILLING_RABBIT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${BILLING_SERVICE_TOKEN}
      IDENTITY_URL: http://os:8080
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OTEL_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      DB_URL: jdbc:postgresql://billing-db:5432/billing
      DB_USER: billing
      DB_PASSWORD: ${BILLING_DB_PASSWORD}
    depends_on:
      rabbit:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
    networks:
    - messages
    - billing-data-net
    mem_limit: 640m
    restart: unless-stopped
  execution:
    build: ../../workshop-execution-service
    environment:
      RABBIT_HOST: rabbit
      RABBIT_USER: execucao-service
      RABBIT_PASSWORD: ${EXECUTION_RABBIT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_TOKEN: ${EXECUTION_SERVICE_TOKEN}
      IDENTITY_URL: http://os:8080
      OTEL_ENDPOINT: http://otel:4318/v1/traces
      OTEL_METRICS_ENDPOINT: http://otel:4318/v1/metrics
      MONGO_URI: mongodb://execution:${MONGO_PASSWORD}@mongo:27017/execution?replicaSet=rs0&authSource=execution
    depends_on:
      rabbit:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      broker-init:
        condition: service_completed_successfully
    networks:
    - messages
    - execution-data-net
    mem_limit: 640m
    restart: unless-stopped
  gateway:
    image: nginx:1.27.2-alpine
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
    - 127.0.0.1:18080:8080
    networks:
    - messages
    depends_on:
    - os
    - billing
    - execution
    mem_limit: 64m
  broker-init:
    image: python:3.12-slim
    depends_on:
      rabbit:
        condition: service_healthy
    volumes:
    - ./broker-init.py:/broker-init.py:ro
    - ./generated/rabbit-definitions.json:/definitions.json:ro
    environment:
      RABBIT_ADMIN_PASSWORD: ${RABBIT_ADMIN_PASSWORD}
    entrypoint:
    - python
    - /broker-init.py
    networks:
    - messages
volumes:
  os-data: {}
  billing-data: {}
  mongo-data: {}
  mongo-key: {}
  rabbit-data: {}
  rabbit-bootstrap-data: {}
networks:
  messages: {}
  os-data-net: {}
  billing-data-net: {}
  execution-data-net: {}
