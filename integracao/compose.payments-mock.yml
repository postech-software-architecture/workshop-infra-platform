# Local-only alternative to compose.payments.yml: Billing talks to a Mercado Pago Orders API mock.
# The mock shares Billing's network namespace because MercadoPagoGateway only accepts plain HTTP on
# localhost; Billing's code and HTTPS guard stay untouched. Values below are fake and never valid
# on api.mercadopago.com. The host port exposes the mock's /v1 and /__mock routes for acceptance scripts.
x-mp-mock: &mp-mock
  MP_ACCESS_TOKEN: TEST-0000000000000000-000000-mock000000000000000000000000-000000000
  MP_SELLER_ID: '1403498245'
  MP_APPLICATION_ID: '7364289770550796'
  MP_POS_ID: OFICINAPOS001
  MP_WEBHOOK_SECRET: mock-webhook-secret
services:
  billing:
    ports:
    - 127.0.0.1:18090:8090
    environment:
      <<: *mp-mock
      PAYMENTS_ENABLED: 'true'
      PAYMENTS_BASE_URL: http://localhost:8090
  mercado-pago-mock:
    image: python:3.12-slim
    network_mode: service:billing
    depends_on:
    - billing
    volumes:
    - ./mercado-pago-mock/server.py:/server.py:ro
    - mercado-pago-mock-data:/data
    entrypoint:
    - python
    - -u
    - /server.py
    environment:
      <<: *mp-mock
      MP_MOCK_WEBHOOK_URL: http://localhost:8080/api/v1/webhooks/mercado-pago
      MP_MOCK_AUTO_PAY_SECONDS: ${MP_MOCK_AUTO_PAY_SECONDS:-0}
      MP_MOCK_STATE_FILE: /data/orders.json
    mem_limit: 64m
    restart: unless-stopped
volumes:
  mercado-pago-mock-data: {}
