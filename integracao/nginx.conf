server {
 listen 8080;
 resolver 127.0.0.11 valid=5s ipv6=off;
 location ~* (^|/)internal(/|$) { return 404; }
 location /os/ { set $backend os:8080; rewrite ^/os/(.*)$ /$1 break; proxy_pass http://$backend; }
 location /billing/ { set $backend billing:8080; rewrite ^/billing/(.*)$ /$1 break; proxy_pass http://$backend; }
 location /execution/ { set $backend execution:8080; rewrite ^/execution/(.*)$ /$1 break; proxy_pass http://$backend; }
 location / { return 404; }
}
