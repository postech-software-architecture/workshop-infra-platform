name: platform-ci
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  bdd-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: integracao/bdd/pom.xml
    - name: Compile BDD and check step bindings only - NOT a real acceptance run
      working-directory: integracao/bdd
      run: mvn -B -ntp -Dcucumber.execution.dry-run=true test
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.2
    - uses: azure/setup-kubectl@v4
    - run: 'python -m compileall -q integracao ops

        kubectl kustomize k8s/overlays/academy > /tmp/platform.yaml

        python -m unittest discover -s tests -v'
