name: platform-ci
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install PyYAML==6.0.2
    - uses: azure/setup-kubectl@v4
    - run: 'python -m compileall -q integracao ops

        kubectl kustomize k8s/overlays/academy > /tmp/platform.yaml

        python -m unittest discover -s tests -v'
