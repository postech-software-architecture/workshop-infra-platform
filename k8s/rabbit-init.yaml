{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "broker-bootstrap"
  },
  "data": {
    "bootstrap.py": "import os, json, base64, urllib.request\nfrom pathlib import Path\ncredentials=base64.b64encode(('local-admin:'+os.environ['RABBIT_ADMIN_PASSWORD']).encode()).decode()\nrequest=urllib.request.Request('http://rabbit:15672/api/definitions',data=Path('/definitions.json').read_bytes(),headers={'Authorization':'Basic '+credentials,'Content-Type':'application/json'},method='POST')\nwith urllib.request.urlopen(request,timeout=30) as response: print('Broker definitions configured:',response.status)\n"
  }
}
---
{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "broker-bootstrap"
  },
  "spec": {
    "backoffLimit": 5,
    "template": {
      "metadata": {
        "labels": {
          "app": "broker-bootstrap"
        }
      },
      "spec": {
        "restartPolicy": "OnFailure",
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "init",
            "image": "python:3.12-alpine",
            "command": [
              "python",
              "/bootstrap/bootstrap.py"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "rabbit-secrets"
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "script",
                "mountPath": "/bootstrap",
                "readOnly": true
              },
              {
                "name": "definitions",
                "mountPath": "/definitions.json",
                "subPath": "definitions.json",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "script",
            "configMap": {
              "name": "broker-bootstrap"
            }
          },
          {
            "name": "definitions",
            "secret": {
              "secretName": "broker-definitions"
            }
          }
        ]
      }
    }
  }
}
