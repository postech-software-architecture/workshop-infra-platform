{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "rabbit"
  },
  "spec": {
    "selector": {
      "app": "rabbit"
    },
    "ports": [
      {
        "port": 5672,
        "targetPort": 5672,
        "name": "amqp"
      },
      {
        "name": "management",
        "port": 15672,
        "targetPort": 15672
      }
    ],
    "clusterIP": "None"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "rabbit"
  },
  "spec": {
    "replicas": 1,
    "serviceName": "rabbit",
    "selector": {
      "matchLabels": {
        "app": "rabbit"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "rabbit"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "rabbit",
            "image": "rabbitmq:4-management",
            "ports": [
              {
                "containerPort": 5672
              },
              {
                "containerPort": 15672
              }
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "rabbit-secrets"
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/var/lib/rabbitmq"
              }
            ],
            "startupProbe": {
              "tcpSocket": {
                "port": 5672
              },
              "failureThreshold": 60,
              "periodSeconds": 5
            },
            "readinessProbe": {
              "tcpSocket": {
                "port": 5672
              }
            },
            "env": [
              {
                "name": "RABBITMQ_NODENAME",
                "value": "rabbit@rabbit-0.rabbit.workshop.svc.cluster.local"
              },
              {
                "name": "RABBITMQ_USE_LONGNAME",
                "value": "true"
              }
            ]
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "10Gi"
            }
          }
        }
      }
    ]
  }
}
