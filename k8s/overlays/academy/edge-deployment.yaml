apiVersion: apps/v1
kind: Deployment
metadata:
  name: fase4-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fase4-edge
  template:
    metadata:
      labels:
        app: fase4-edge
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx:1.27.2-alpine
        command:
        - sh
        - -ec
        - DNS=$(awk '/^nameserver/{print $2;exit}' /etc/resolv.conf); sed "s/__DNS__/$DNS/g"
          /config/nginx.conf > /tmp/nginx.conf; exec nginx -c /tmp/nginx.conf -g "daemon
          off;"
        ports:
        - containerPort: 8080
        - containerPort: 8081
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          runAsUser: 101
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
      volumes:
      - name: config
        configMap:
          name: fase4-edge
      - name: tmp
        emptyDir: {}
