{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "mongo-bootstrap"
  },
  "data": {
    "init.js": "const c = new Mongo('mongodb://mongo:27017/?directConnection=true&serverSelectionTimeoutMS=5000');\nconst admin = c.getDB('admin');\nadmin.auth('root', process.env.MONGO_ROOT_PASSWORD || process.env.MONGO_INITDB_ROOT_PASSWORD);\nconst existing = c.getDB('local').getCollection('system.replset').findOne();\nlet state;\ntry { state = admin.runCommand({replSetGetStatus: 1}); }\ncatch (e) { state = {ok: 0, code: e.code}; }\nlet initialized = false;\nif (!state.ok) {\n  if (state.code !== 94 || existing) throw new Error('Replica state requires review; existing configuration preserved');\n  const result = admin.runCommand({replSetInitiate: {\n    _id: 'rs0', members: [{_id: 0, host: 'mongo-0.mongo.workshop.svc.cluster.local:27017'}]\n  }});\n  if (!result.ok) throw new Error('Replica initialization failed');\n  initialized = true;\n} else if (!existing || existing._id !== 'rs0' || existing.members.length !== 1) {\n  throw new Error('Unexpected existing replica configuration; no reconfiguration performed');\n}\nlet primary = false;\nfor (let i = 0; i < 120; i++) {\n  if (admin.runCommand({hello: 1}).isWritablePrimary) { primary = true; break; }\n  sleep(500);\n}\nif (!primary) throw new Error('No writable primary; existing data and credentials preserved');\nconst app = c.getDB('execution');\nconst user = app.getUser('execution');\nif (!user) app.createUser({user: 'execution', pwd: process.env.MONGO_PASSWORD,\n                         roles: [{role: 'readWrite', db: 'execution'}]});\nelse if (!user.roles.some(r => r.role === 'readWrite' && r.db === 'execution')) {\n  throw new Error('Existing application user has unexpected roles; no password or roles changed');\n}\nprint(JSON.stringify({primary: true, initialized, applicationUserCreated: !user, existingPasswordsPreserved: true}));\n"
  }
}
---
{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "mongo-bootstrap"
  },
  "spec": {
    "backoffLimit": 5,
    "template": {
      "metadata": {
        "labels": {
          "app": "mongo-bootstrap"
        }
      },
      "spec": {
        "restartPolicy": "OnFailure",
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "init",
            "image": "mongo:7.0.45",
            "command": [
              "mongosh",
              "--nodb",
              "--quiet",
              "/bootstrap/init.js"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "mongo-secrets"
                }
              }
            ],
            "volumeMounts": [
              {
                "name": "init",
                "mountPath": "/bootstrap",
                "readOnly": true
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "init",
            "configMap": {
              "name": "mongo-bootstrap"
            }
          }
        ]
      }
    }
  }
}
