{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "os-db"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "os-db"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app": "os-service"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 5432
          }
        ]
      }
    ]
  }
}
