---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "mongo"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "mongo"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app": "execucao-service"
              }
            }
          },
          {
            "podSelector": {
              "matchLabels": {
                "app": "mongo-bootstrap"
              }
            }
          },
          {
            "podSelector": {
              "matchLabels": {
                "app": "mongo"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 27017
          }
        ]
      }
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "rabbit"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "rabbit"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app": "os-service"
              }
            }
          },
          {
            "podSelector": {
              "matchLabels": {
                "app": "billing-service"
              }
            }
          },
          {
            "podSelector": {
              "matchLabels": {
                "app": "execucao-service"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 5672
          }
        ]
      },
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app": "broker-bootstrap"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 15672
          }
        ]
      }
    ]
  }
}
