{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "mongo"
  },
  "spec": {
    "selector": {
      "app": "mongo"
    },
    "ports": [
      {
        "port": 27017,
        "targetPort": 27017
      }
    ],
    "clusterIP": "None",
    "publishNotReadyAddresses": true
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "mongo"
  },
  "spec": {
    "replicas": 1,
    "serviceName": "mongo",
    "selector": {
      "matchLabels": {
        "app": "mongo"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "mongo"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "name": "mongo",
            "image": "mongo:7.0.45",
            "ports": [
              {
                "containerPort": 27017
              }
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "mongo-secrets"
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "1",
                "memory": "1Gi"
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data/db"
              },
              {
                "name": "key",
                "mountPath": "/key",
                "readOnly": true
              }
            ],
            "startupProbe": {
              "tcpSocket": {
                "port": 27017
              },
              "failureThreshold": 60,
              "periodSeconds": 5
            },
            "readinessProbe": {
              "exec": {
                "command": [
                  "mongosh",
                  "--nodb",
                  "--quiet",
                  "--eval",
                  "const c=new Mongo('mongodb://127.0.0.1:27017/?directConnection=true&serverSelectionTimeoutMS=2000');const a=c.getDB('admin');a.auth('root',process.env.MONGO_ROOT_PASSWORD);quit(a.runCommand({hello:1}).isWritablePrimary?0:1);"
                ]
              },
              "periodSeconds": 5,
              "timeoutSeconds": 5
            },
            "args": [
              "--replSet",
              "rs0",
              "--bind_ip_all",
              "--auth",
              "--keyFile",
              "/key/keyfile"
            ]
          }
        ],
        "initContainers": [
          {
            "name": "wait-for-own-dns",
            "image": "busybox:1.36",
            "env": [
              {
                "name": "POD_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              }
            ],
            "command": [
              "sh",
              "-ec",
              "test -n \"$POD_IP\"; for attempt in $(seq 1 60); do if nslookup mongo.workshop.svc.cluster.local. | grep -F \"$POD_IP\" >/dev/null; then exit 0; fi; sleep 2; done; echo \"Mongo service DNS has not converged to the current pod\"; exit 1"
            ]
          },
          {
            "name": "key-permissions",
            "image": "busybox:1.36",
            "command": [
              "sh",
              "-c",
              "cp /source/keyfile /key/keyfile && chown 999:999 /key/keyfile && chmod 400 /key/keyfile"
            ],
            "volumeMounts": [
              {
                "name": "key-source",
                "mountPath": "/source",
                "readOnly": true
              },
              {
                "name": "key",
                "mountPath": "/key"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "key-source",
            "secret": {
              "secretName": "mongo-key"
            }
          },
          {
            "name": "key",
            "emptyDir": {}
          }
        ]
      }
    },
    "volumeClaimTemplates": [
      {
        "metadata": {
          "name": "data"
        },
        "spec": {
          "accessModes": [
            "ReadWriteOnce"
          ],
          "resources": {
            "requests": {
              "storage": "10Gi"
            }
          }
        }
      }
    ]
  }
}
